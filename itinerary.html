<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#35ace3"><title>旅程 | 旅行予算</title><link rel="manifest" href="./manifest.json"><style>
:root{--blue:#27afe7;--ink:#26364b;--sub:#708096;--line:#dce6f0;--bg:#eff5fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);padding:0 0 max(22px,env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:54px 1fr 54px;align-items:center;min-height:70px;padding:env(safe-area-inset-top) 14px 0;background:#fff;border-bottom:1px solid var(--line)}.top h1{margin:0;text-align:center;font-size:19px}.back{color:var(--blue);font-size:26px;text-decoration:none;text-align:center}.wrap{max-width:680px;margin:auto;padding:14px}.trip{padding:14px;border-radius:14px;background:linear-gradient(130deg,#288ece,#50c5ef);color:#fff;box-shadow:0 5px 17px #226b9a30}.trip select{width:100%;padding:9px;border:0;border-radius:9px;font:inherit;color:var(--ink);background:#fff;margin-top:5px}.trip small{opacity:.9}.hint{margin:12px 1px;color:var(--sub);font-size:13px}.day{margin:16px 0}.dayhead{display:flex;align-items:baseline;gap:9px;margin:0 3px 8px}.dayhead b{font-size:18px}.dayhead span{font-size:13px;color:var(--sub)}.events{border-left:2px solid #bfe6f7;margin-left:14px;padding-left:18px}.event{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin:0 0 10px;box-shadow:0 2px 7px #41668a12}.event:before{content:"";position:absolute;left:-25px;top:17px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:3px solid var(--bg)}.event-row{display:grid;grid-template-columns:68px 1fr 32px;gap:7px;align-items:center}.time{font-weight:700;color:#168bbd;font-variant-numeric:tabular-nums}.title{font-weight:700}.place,.memo{font-size:13px;color:var(--sub);margin:5px 0 0 75px}.del{border:0;background:transparent;color:#c34b4b;font-size:18px}.add{width:100%;margin-top:3px;border:1px dashed #91cce7;border-radius:11px;padding:11px;background:#f7fcff;color:#178fc5;font:inherit}.sheet{display:none;position:fixed;z-index:10;inset:0;background:#17233766;align-items:flex-end}.sheet.open{display:flex}.panel{width:100%;max-width:680px;margin:auto;background:#fff;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-left)) max(18px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #17233733}.panel h2{margin:0 0 12px;font-size:18px}.panel label{display:block;margin:10px 0 4px;font-size:13px;color:var(--sub)}.panel input,.panel textarea,.panel select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}.panel textarea{min-height:65px;resize:vertical}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1;border:0;border-radius:9px;padding:11px;font:inherit}.save{background:var(--blue);color:#fff}.cancel{background:#edf2f6;color:var(--ink)}.empty{color:var(--sub);padding:18px 2px;text-align:center}@media(min-width:700px){.top{border-radius:0 0 15px 15px}.wrap{padding-top:22px}}
</style></head><body><header class="top"><a class="back" href="./index.html" aria-label="ホームへ戻る">‹</a><h1>旅程</h1><span></span></header><main class="wrap"><section class="trip"><small>表示する旅行</small><select id="tripSel"></select></section><p class="hint">予定はこの端末に自動保存され、予算・航空券ページと同じ旅行に紐づきます。</p><div id="days"></div></main><div class="sheet" id="sheet"><form class="panel" id="form"><h2 id="formTitle">予定を追加</h2><input id="eventId" type="hidden"><label>日付</label><input id="date" type="date" required><label>時刻（任意）</label><input id="time" type="time"><label>予定</label><input id="title" placeholder="例：ホテルにチェックイン" required><label>場所（任意）</label><input id="place" placeholder="例：タシュケント国際空港"><label>メモ（任意）</label><textarea id="memo" placeholder="予約番号・集合場所など"></textarea><div class="actions"><button class="cancel" type="button" id="cancel">キャンセル</button><button class="save" type="submit">保存</button></div></form></div><script src="./itinerary.js"></script></body></html>
